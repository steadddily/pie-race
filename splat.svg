<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="bg" cx="42%" cy="50%" r="70%">
      <stop offset="0" stop-color="#7a3570"/>
      <stop offset="1" stop-color="#3a1534"/>
    </radialGradient>
    <radialGradient id="skin" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#f1cfae"/>
      <stop offset=".55" stop-color="#d9a77f"/>
      <stop offset="1" stop-color="#b07a55"/>
    </radialGradient>
    <radialGradient id="beard" cx="50%" cy="85%" r="70%">
      <stop offset="0" stop-color="#f2f0ec"/>
      <stop offset=".45" stop-color="#c9c4be"/>
      <stop offset="1" stop-color="#4c4541"/>
    </radialGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#efe0c2"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d44"/>
      <stop offset="1" stop-color="#22242a"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- impact rays -->
  <g fill="#ffffff" opacity=".07">
    <path d="M290 200 L640 120 L640 170 Z"/><path d="M290 200 L640 230 L640 290 Z"/>
    <path d="M290 200 L560 400 L480 400 Z"/><path d="M290 200 L360 0 L440 0 Z"/>
    <path d="M290 200 L0 60 L0 120 Z"/><path d="M290 200 L0 260 L0 330 Z"/>
    <path d="M290 200 L120 0 L190 0 Z"/><path d="M290 200 L140 400 L60 400 Z"/>
  </g>

  <!-- confetti -->
  <g>
    <rect x="40" y="40" width="12" height="6" fill="#ffd166" transform="rotate(25 46 43)"/>
    <rect x="90" y="340" width="12" height="6" fill="#ef8a5a" transform="rotate(-30 96 343)"/>
    <rect x="600" y="352" width="12" height="6" fill="#ffd166" transform="rotate(40 606 355)"/>
    <rect x="62" y="190" width="10" height="5" fill="#f7b6e8" transform="rotate(-15 67 192)"/>
    <rect x="560" y="30" width="10" height="5" fill="#f7b6e8" transform="rotate(60 565 32)"/>
    <circle cx="150" cy="60" r="4" fill="#ffd166"/>
    <circle cx="30" cy="300" r="4" fill="#f7b6e8"/>
  </g>

  <!-- suit and shirt -->
  <path d="M110 400 C116 334 170 300 280 298 C390 300 444 334 450 400 Z" fill="url(#suit)"/>
  <path d="M240 300 L280 400 L320 300 Z" fill="#f7f5f2"/>
  <path d="M240 300 L262 338 L280 316 Z M320 300 L298 338 L280 316 Z" fill="#e4e0da"/>
  <path d="M230 302 L278 400 L250 400 L206 312 Z" fill="#2a2c32"/>
  <path d="M330 302 L282 400 L310 400 L354 312 Z" fill="#2a2c32"/>
  <path d="M256 262 L304 262 L310 304 L280 318 L250 304 Z" fill="#c48e66"/>
  <path d="M256 268 C270 282 292 282 304 268 L306 286 C290 298 270 298 254 286 Z" fill="#a8734f" opacity=".6"/>

  <!-- ears -->
  <ellipse cx="210" cy="204" rx="13" ry="20" fill="#cf9a72"/>
  <ellipse cx="350" cy="204" rx="13" ry="20" fill="#cf9a72"/>
  <path d="M206 196 q6 8 0 18" stroke="#a8734f" stroke-width="3" fill="none"/>

  <!-- bald head -->
  <ellipse cx="280" cy="188" rx="70" ry="84" fill="url(#skin)"/>
  <ellipse cx="256" cy="132" rx="30" ry="16" fill="#ffffff" opacity=".35" transform="rotate(-20 256 132)"/>
  <!-- short grey hair at the sides -->
  <path d="M213 176 C212 196 214 212 220 226 L226 222 C221 208 219 192 220 176 Z" fill="#8d847d" opacity=".55"/>
  <path d="M347 176 C348 196 346 212 340 226 L334 222 C339 208 341 192 340 176 Z" fill="#8d847d" opacity=".55"/>

  <!-- beard: dark sides, grey-white chin -->
  <path d="M216 214 C220 252 240 290 280 298 C320 290 340 252 344 214 C334 232 322 240 306 242 C296 236 288 234 280 234 C272 234 264 236 254 242 C238 240 226 232 216 214 Z" fill="url(#beard)"/>
  <!-- moustache -->
  <path d="M250 240 C262 230 274 230 280 234 C286 230 298 230 310 240 C298 246 288 244 280 242 C272 244 262 246 250 240 Z" fill="#3b3431"/>
  <!-- surprised open mouth -->
  <ellipse cx="270" cy="256" rx="11" ry="9" fill="#5a2a26"/>
  <ellipse cx="270" cy="260" rx="6" ry="4" fill="#b8574d"/>

  <!-- raised eyebrow and the visible eye -->
  <path d="M222 156 Q240 142 260 152" stroke="#4a423e" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="241" cy="182" rx="11" ry="13" fill="#ffffff"/>
  <circle cx="243" cy="184" r="6" fill="#5a3a22"/>
  <circle cx="243" cy="184" r="3" fill="#1d1412"/>
  <circle cx="245" cy="181" r="1.8" fill="#ffffff"/>
  <!-- glasses knocked askew: burgundy rectangular frames -->
  <g transform="rotate(-14 260 182)">
    <rect x="220" y="166" width="44" height="32" rx="7" fill="#ffffff" fill-opacity=".12" stroke="#7a2630" stroke-width="5"/>
    <path d="M264 178 L282 176" stroke="#7a2630" stroke-width="5" stroke-linecap="round"/>
    <path d="M220 174 L206 170" stroke="#7a2630" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- cream over the right side of the face -->
  <path d="M276 150 C298 136 330 140 346 158 C360 174 356 198 354 214 C352 232 344 244 338 254 C334 268 330 280 324 288 C320 276 322 264 314 260 C306 272 304 286 296 292 C292 280 294 268 286 262 C280 250 276 240 280 228 C268 218 266 200 270 184 C262 174 264 160 276 150 Z" fill="url(#cream)" stroke="#e0cca6" stroke-width="2"/>
  <circle cx="306" cy="188" r="9" fill="#c0392b"/>
  <circle cx="326" cy="222" r="7" fill="#c0392b"/>
  <circle cx="296" cy="236" r="6" fill="#c0392b"/>
  <circle cx="303" cy="185" r="2.5" fill="#ffffff" opacity=".6"/>
  <!-- cream on the scalp, with a cherry -->
  <path d="M290 108 C300 96 324 98 330 112 C334 122 322 128 312 126 C302 130 286 122 290 108 Z" fill="url(#cream)" stroke="#e0cca6" stroke-width="1.5"/>
  <circle cx="312" cy="102" r="8" fill="#c0392b"/>
  <path d="M312 94 q4 -12 14 -14" stroke="#4f7a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- pie tin pressed to the face, seen edge on -->
  <g transform="rotate(-8 364 206)">
    <ellipse cx="364" cy="206" rx="16" ry="72" fill="#b9bfc6"/>
    <ellipse cx="358" cy="206" rx="10" ry="66" fill="#d8a85e"/>
    <path d="M352 142 Q346 206 352 270" stroke="#b07c34" stroke-width="3" fill="none"/>
  </g>

  <!-- thrower's arm from the right -->
  <path d="M660 318 C560 300 476 262 404 224" stroke="#16383a" stroke-width="46" stroke-linecap="round" fill="none"/>
  <path d="M660 318 C560 300 476 262 404 224" stroke="#2f7378" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M418 212 L424 244" stroke="#f7f5f2" stroke-width="8" stroke-linecap="round"/>
  <circle cx="390" cy="214" r="22" fill="#e2b48e"/>
  <path d="M378 196 q-10 18 0 36" stroke="#c48e66" stroke-width="3" fill="none"/>

  <!-- motion lines -->
  <g stroke="#fdf5fc" stroke-width="4" stroke-linecap="round" opacity=".75">
    <line x1="480" y1="196" x2="550" y2="214"/>
    <line x1="490" y1="226" x2="590" y2="252"/>
    <line x1="460" y1="170" x2="520" y2="182"/>
  </g>

  <!-- flying cream -->
  <g fill="#fffaf0" stroke="#e0cca6" stroke-width="1.5">
    <circle cx="186" cy="130" r="9"/><circle cx="168" cy="116" r="5"/>
    <circle cx="176" cy="176" r="8"/><circle cx="146" cy="210" r="12"/>
    <circle cx="186" cy="250" r="7"/><circle cx="228" cy="96" r="8"/>
    <circle cx="262" cy="76" r="6"/><circle cx="344" cy="300" r="8"/>
    <circle cx="210" cy="286" r="6"/><circle cx="118" cy="160" r="6"/>
    <circle cx="196" cy="272" r="4"/><circle cx="356" cy="84" r="7"/>
  </g>
  <circle cx="126" cy="246" r="6" fill="#c0392b"/>
  <circle cx="200" cy="70" r="5" fill="#c0392b"/>

  <!-- SPLAT burst -->
  <g transform="translate(510 92) rotate(-10)">
    <path d="M0 -62 L16 -30 L52 -46 L36 -12 L74 0 L36 14 L52 48 L16 32 L0 64 L-16 32 L-52 48 L-36 14 L-74 0 L-36 -12 L-52 -46 L-16 -30 Z" fill="#ef8a5a"/>
    <text x="0" y="12" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="30" fill="#ffd166" stroke="#4b1f43" stroke-width="3" paint-order="stroke" text-anchor="middle">SPLAT!</text>
  </g>
</svg>
