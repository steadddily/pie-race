<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 90 320 300" width="320" height="300">
  <defs>
    <radialGradient id="skin" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#f1cfae"/>
      <stop offset=".55" stop-color="#d9a77f"/>
      <stop offset="1" stop-color="#b07a55"/>
    </radialGradient>
    <radialGradient id="beard" cx="50%" cy="85%" r="70%">
      <stop offset="0" stop-color="#f2f0ec"/>
      <stop offset=".45" stop-color="#c9c4be"/>
      <stop offset="1" stop-color="#4c4541"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d44"/>
      <stop offset="1" stop-color="#22242a"/>
    </linearGradient>
  </defs>
  <!-- suit and shirt -->
  <path d="M130 400 C136 334 180 300 280 298 C380 300 424 334 430 400 Z" fill="url(#suit)"/>
  <path d="M240 300 L280 400 L320 300 Z" fill="#f7f5f2"/>
  <path d="M230 302 L278 400 L250 400 L206 312 Z" fill="#2a2c32"/>
  <path d="M330 302 L282 400 L310 400 L354 312 Z" fill="#2a2c32"/>
  <path d="M256 262 L304 262 L310 304 L280 318 L250 304 Z" fill="#c48e66"/>
  <!-- ears -->
  <ellipse cx="210" cy="204" rx="13" ry="20" fill="#cf9a72"/>
  <ellipse cx="350" cy="204" rx="13" ry="20" fill="#cf9a72"/>
  <!-- head -->
  <ellipse cx="280" cy="188" rx="70" ry="84" fill="url(#skin)"/>
  <ellipse cx="256" cy="132" rx="30" ry="16" fill="#ffffff" opacity=".35" transform="rotate(-20 256 132)"/>
  <path d="M213 176 C212 196 214 212 220 226 L226 222 C221 208 219 192 220 176 Z" fill="#8d847d" opacity=".55"/>
  <path d="M347 176 C348 196 346 212 340 226 L334 222 C339 208 341 192 340 176 Z" fill="#8d847d" opacity=".55"/>
  <!-- short beard: darker at the sides and lip, grey-white at the chin -->
  <path d="M214 206 C216 250 238 294 280 300 C322 294 344 250 346 206 C340 222 330 232 318 236 C308 226 294 222 280 222 C266 222 252 226 242 236 C230 232 220 222 214 206 Z" fill="url(#beard)"/>
  <path d="M248 236 C258 226 270 223 280 224 C290 223 302 226 312 236 C302 240 292 241 280 240 C268 241 258 240 248 236 Z" fill="#6b625d" opacity=".85"/>
  <!-- mouth: a tight, nervous line -->
  <path d="M266 254 Q280 249 294 254" stroke="#5a2a26" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- worried brows -->
  <path d="M224 160 Q240 150 258 160" stroke="#4a423e" stroke-width="6" fill="none" stroke-linecap="round" transform="rotate(8 241 156)"/>
  <path d="M302 160 Q320 150 336 160" stroke="#4a423e" stroke-width="6" fill="none" stroke-linecap="round" transform="rotate(-8 319 156)"/>
  <!-- eyes looking left, toward the incoming pies -->
  <ellipse cx="241" cy="184" rx="11" ry="13" fill="#ffffff"/>
  <ellipse cx="319" cy="184" rx="11" ry="13" fill="#ffffff"/>
  <circle cx="236" cy="186" r="6" fill="#5a3a22"/><circle cx="236" cy="186" r="3" fill="#1d1412"/>
  <circle cx="314" cy="186" r="6" fill="#5a3a22"/><circle cx="314" cy="186" r="3" fill="#1d1412"/>
  <!-- burgundy rectangular glasses -->
  <rect x="219" y="168" width="44" height="32" rx="7" fill="#ffffff" fill-opacity=".12" stroke="#7a2630" stroke-width="5"/>
  <rect x="297" y="168" width="44" height="32" rx="7" fill="#ffffff" fill-opacity=".12" stroke="#7a2630" stroke-width="5"/>
  <path d="M263 182 Q280 176 297 182" stroke="#7a2630" stroke-width="5" fill="none"/>
  <path d="M219 176 L206 172 M341 176 L354 172" stroke="#7a2630" stroke-width="4" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M282 196 Q290 214 280 222" stroke="#b07a55" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
